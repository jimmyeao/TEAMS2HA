name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            label: x64
          - target: aarch64-pc-windows-msvc
            label: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        shell: pwsh
        working-directory: tauri
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' must be X.Y.Z semver (e.g. v1.2.3). Aborting."
            exit 1
          }
          Write-Host "Stamping internal version $version from tag $tag"
          foreach ($f in @('src-tauri/tauri.conf.json', 'package.json')) {
            (Get-Content $f -Raw) -replace '"version":\s*"[^"]*"', "`"version`": `"$version`"" |
              Set-Content $f -Encoding utf8 -NoNewline
          }
          (Get-Content src-tauri/Cargo.toml -Raw) -replace '(?m)^version = "[^"]*"', "version = `"$version`"" |
            Set-Content src-tauri/Cargo.toml -Encoding utf8 -NoNewline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: tauri

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without this the build still succeeds but
          # produces no .sig files, and clients reject the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The signing key has no password, but this must still be present and empty:
          # if the variable is unset entirely the CLI prompts for a password on stdin
          # and the job hangs until it times out. GitHub rejects empty secret values,
          # so it is hardcoded here rather than stored as a secret.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: tauri
          tagName: ${{ github.ref_name }}
          releaseName: Teams2HA ${{ github.ref_name }}
          releaseBody: |
            ## Installation
            Download the installer for your architecture and run it.
            No administrator rights required — installs per-user to `%LOCALAPPDATA%`.

            | File | Architecture |
            |------|-------------|
            | `Teams2HA_*_x64-setup.exe` | Intel / AMD (most PCs) |
            | `Teams2HA_*_arm64-setup.exe` | ARM64 (Surface Pro X, Copilot+ PCs) |

            If you previously had the .NET version installed, it will be automatically
            removed on first launch of the new version.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
          # Must be explicitly false: it defaults to true, and with a build matrix each
          # job then publishes a latest.json describing only its own architecture, the
          # second overwriting the first. The combined manifest is assembled once, in
          # the job below. Left at the default, a client checking for updates midway
          # through a release could fetch a manifest that omits its own architecture.
          includeUpdaterJson: false

  # The updater endpoint in tauri.conf.json points at this file. It must list every
  # architecture, so it can only be built after all matrix jobs have uploaded their
  # installers and signatures.
  updater-manifest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Build and upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          gh release download "$TAG" --repo "$REPO" --pattern '*-setup.exe.sig' --dir sigs

          # Fail loudly rather than publishing a manifest that silently omits an
          # architecture — a missing .sig means that build was not signed.
          x64_sig_file=$(find sigs -name '*x64-setup.exe.sig' | head -n1)
          arm_sig_file=$(find sigs -name '*arm64-setup.exe.sig' | head -n1)
          for f in "$x64_sig_file" "$arm_sig_file"; do
            if [ -z "$f" ] || [ ! -s "$f" ]; then
              echo "::error::Missing or empty updater signature. Is TAURI_SIGNING_PRIVATE_KEY set?"
              exit 1
            fi
          done

          base="https://github.com/$REPO/releases/download/$TAG"

          # jq --arg handles JSON escaping; signatures must not be interpolated raw.
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg x64_sig "$(cat "$x64_sig_file")" \
            --arg x64_url "$base/$(basename "$x64_sig_file" .sig)" \
            --arg arm_sig "$(cat "$arm_sig_file")" \
            --arg arm_url "$base/$(basename "$arm_sig_file" .sig)" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64":  { signature: $x64_sig, url: $x64_url },
                "windows-aarch64": { signature: $arm_sig, url: $arm_url }
              }
            }' > latest.json

          cat latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

      - name: Append auto-generated changelog to release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Diffs merged PRs/commits since the previous tag; GitHub picks the
          # previous tag automatically when target_commitish/previous_tag_name
          # are omitted.
          changelog=$(gh api "repos/$REPO/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq '.body')

          current_body=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body')

          {
            printf '%s\n' "$current_body"
            printf '\n---\n\n'
            printf '%s\n' "$changelog"
          } > combined_notes.md

          gh release edit "$TAG" --repo "$REPO" --notes-file combined_notes.md
